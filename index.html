<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Birthday!</title>
  <style>
    :root {
      --soft-pink: #ffe4e1;
      --card-bg: #ffffff;
      --pink-accent: #ff4081;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--soft-pink);
      background-image: radial-gradient(#f8bbd0 1px, transparent 0);
      background-size: 20px 20px;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .card-wrapper {
      width: 100%;
      max-width: 450px; /* Parfait pour tel */
    }

    .card {
      width: 100%;
      aspect-ratio: 4/5.6;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      border: 4px solid white;
      cursor: pointer;
      position: relative;
    }

    .card img { width: 100%; height: 100%; object-fit: cover; }

    .open-btn {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      color: var(--pink-accent);
      border: 2px solid var(--pink-accent);
      padding: 10px 25px;
      border-radius: 50px;
      font-weight: bold;
      animation: pulse 1.5s infinite;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    @keyframes pulse { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.05); } }

    .spread-container {
      display: none;
      width: 100%;
      background: white;
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      border: 2px solid #f8bbd0;
      flex-direction: column;
      gap: 15px;
    }

    .spread-container.visible { display: flex; }

    .page { width: 100%; position: relative; display: flex; flex-direction: column; align-items: center; }

    .envelope-bg { width: 80%; max-height: 300px; object-fit: contain; cursor: pointer; }
    
    .cake-wrapper { position: relative; width: 100%; text-align: center; }
    .cake-img { width: 80%; max-width: 250px; }

    .flame {
      position: absolute;
      width: 15px;
      height: 25px;
      background: #ff9800;
      border-radius: 50%;
      top: -10px;
      animation: flicker 0.1s infinite alternate;
      transition: opacity 0.5s;
    }
    .flame-left { left: 38%; }
    .flame-right { right: 38%; }
    .flame.extinguished { opacity: 0; }

    @keyframes flicker { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

    .btn {
      background: white;
      color: var(--pink-accent);
      border: 2px solid var(--pink-accent);
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
      transition: 0.3s;
    }
    .btn::before { content: '🎀 '; }
    .btn:active { transform: scale(0.95); }

    .letter-popup {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 90%;
      max-width: 350px;
      transition: 0.3s;
      z-index: 100;
    }
    .letter-popup.active { transform: translate(-50%, -50%) scale(1); }
  </style>
</head>
<body>

  <div class="card-wrapper">
    <!-- COVER -->
    <div class="card" id="cardCover" onclick="openCard()">
      <img src="couverture.png" alt="Cover">
      <div class="open-btn">Open 🎀</div>
    </div>

    <!-- SPREAD -->
    <div class="spread-container" id="spreadContainer">
      <button class="btn" style="width: 80px;" onclick="closeCard()">Back</button>
      
      <!-- LETTER -->
      <div class="page" onclick="toggleLetter()">
        <img src="enveloppe_fleurs.png" class="envelope-bg">
      </div>

      <!-- CAKE -->
      <div class="page">
        <div class="cake-wrapper">
          <img src="gateau.png" class="cake-img">
          <div class="flame flame-left" id="flame1"></div>
          <div class="flame flame-right" id="flame2"></div>
        </div>
        <button class="btn" id="micBtn" onclick="initMic()">Enable mic</button>
        <div id="wishMessage" style="display:none; text-align:center; margin-top:10px;">
          <p style="color:var(--pink-accent); font-weight:bold;">One wish, Willow ✨</p>
          <button class="btn" onclick="relight()">Relight</button>
        </div>
      </div>
    </div>
  </div>

  <div class="letter-popup" id="letterPopup" onclick="toggleLetter()">
    <img src="lettre_message.png" style="width:100%; border-radius:10px;">
  </div>

  <script>
    function openCard() {
      document.getElementById('cardCover').style.display = 'none';
      document.getElementById('spreadContainer').classList.add('visible');
    }
    function closeCard() {
      document.getElementById('spreadContainer').classList.remove('visible');
      document.getElementById('cardCover').style.display = 'block';
    }
    function toggleLetter() { document.getElementById('letterPopup').classList.toggle('active'); }

    let audioContext, analyser, micEnabled = false;
    async function initMic() {
      if(micEnabled) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new AudioContext();
        analyser = audioContext.createAnalyser();
        audioContext.createMediaStreamSource(stream).connect(analyser);
        analyser.fftSize = 256;
        document.getElementById('micBtn').innerText = "Blow 🌬️";
        micEnabled = true;
        checkBlow();
      } catch(e) { alert("Mic required"); }
    }

    function checkBlow() {
      let data = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(data);
      let sum = data.reduce((a,b) => a+b);
      if (sum > 5000) extinguish();
      else requestAnimationFrame(checkBlow);
    }

    function extinguish() {
      document.getElementById('flame1').classList.add('extinguished');
      document.getElementById('flame2').classList.add('extinguished');
      document.getElementById('micBtn').style.display = 'none';
      document.getElementById('wishMessage').style.display = 'block';
    }

    function relight() {
      document.getElementById('flame1').classList.remove('extinguished');
      document.getElementById('flame2').classList.remove('extinguished');
      document.getElementById('micBtn').style.display = 'block';
      document.getElementById('wishMessage').style.display = 'none';
    }
  </script>
</body>
</html>
